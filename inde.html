<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>music-player | 听歌</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#f7f8fa;color:#222;padding:20px;max-width:480px;margin:0 auto}
        .title{font-size:28px;margin-bottom:8px}
        .sub{color:#666;margin-bottom:30px}
        .player-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px #00000010}
        .cover{width:100%;aspect-ratio:1/1;border-radius:12px;background:#eee;margin-bottom:20px;object-fit:cover}
        .info h3{font-size:20px}
        .info p{color:#777;margin:4px 0 20px}
        audio{width:100%}
        .upload-area{margin-top:24px;padding:16px;border:1px dashed #aaa;border-radius:12px;text-align:center}
        .song-list{margin-top:24px}
        .song-item{padding:12px;border-bottom:1px solid #eee;cursor:pointer}
        .song-item:active{background:#f0f0f0}
    </style>
</head>
<body>
    <h1 class="title">music-player</h1>
    <div class="sub">听歌</div>
    <div class="player-card">
        <img class="cover" id="coverImg" src="" alt="封面">
        <div class="info">
            <h3 id="songName">未选择歌曲</h3>
            <p id="artist">--</p>
        </div>
        <audio id="audio" controls>
    </div>

    <div class="upload-area">
        <p>上传本地音频文件</p>
        <input type="file" id="fileInput" accept="audio/*">
    </div>

    <div class="song-list" id="songListBox"></div>

<script>
let songList = [];
const audio = document.getElementById('audio');
const songName = document.getElementById('songName');
const artist = document.getElementById('artist');
const coverImg = document.getElementById('coverImg');
const songListBox = document.getElementById('songListBox');

// 读取歌单，就算json读取失败页面也不会白屏
fetch('./songlist.json')
.then(res=>res.json())
.then(data=>{
    songList = data;
    renderList();
})
.catch(err=>{
    console.log("歌单加载失败，可上传本地音频");
})

// 渲染歌单
function renderList(){
    songListBox.innerHTML = "";
    songList.forEach((item,idx)=>{
        const div = document.createElement('div');
        div.className = "song-item";
        div.innerText = `${item.name} - ${item.artist}`;
        div.onclick = ()=>playSong(item);
        songListBox.appendChild(div);
    })
}

// 播放歌曲
function playSong(item){
    songName.innerText = item.name;
    artist.innerText = item.artist;
    coverImg.src = item.cover || "";
    audio.src = item.url;
    audio.play();
}

// 本地文件上传
document.getElementById("fileInput").onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    songName.innerText = file.name;
    artist.innerText = "本地音频";
    coverImg.src = "";
    audio.src = url;
    audio.play();
}
</script>
</body>
</html>
